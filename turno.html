<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu turno Banco de Bogotá</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fa;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            background-color: #e9e9e9;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            color: #333;
            border-bottom: 1px solid #ccc;
        }
        .container {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: center;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        .content-left {
            flex: 1;
            padding-right: 50px;
        }
        .content-right {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        p {
            font-size: 16px;
            margin-bottom: 20px;
        }
        .steps {
            list-style: none;
            padding: 0;
            margin-bottom: 40px;
        }
        .steps li {
            margin-bottom: 10px;
            font-size: 16px;
        }
        .btn-solicitar {
            background-color: #0033a0;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background 0.3s;
        }
        .btn-solicitar:hover {
            background-color: #002270;
        }
        
        /* Phone Mockup CSS */
        .phone-mockup {
            width: 280px;
            height: 550px;
            background-color: #0033a0;
            border-radius: 35px;
            padding: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            position: relative;
            box-sizing: border-box;
            border: 8px solid #1a4bb5;
        }
        .phone-screen {
            background-color: #0033a0;
            width: 100%;
            height: 100%;
            border-radius: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .phone-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 25px;
            background-color: #1a4bb5;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            z-index: 2;
        }
        .logo-container {
            text-align: center;
        }
        .logo-container img {
            width: 180px; /* Adjusted size */
            margin-bottom: 20px;
            /* Filter removed to show original colors */
        }
        .logo-text {
            color: white;
            font-weight: bold;
            font-size: 18px;
            display: none; /* Hide text if logo contains it, or keep it if logo is just symbol. Assuming logo.png is full logo. */
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                flex-direction: column-reverse;
                padding: 20px;
            }
            .content-left {
                padding-right: 0;
                text-align: center;
                margin-top: 30px;
            }
            .phone-mockup {
                width: 220px;
                height: 440px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        Tu turno Banco de Bogotá
    </div>
    <div class="container">
        <div class="content-left">
            <h1>Solicita o modifica tu turno</h1>
            <p>En solo tres pasos:</p>
            <ul class="steps">
                <li>1. Ingresa tus datos personales</li>
                <li>2. Elige la oficina más cercana</li>
                <li>3. Selecciona el servicio que deseas realizar</li>
            </ul>
            <button class="btn-solicitar">Solicitar Turno</button>
        </div>
        <div class="content-right">
            <div class="phone-mockup">
                <div class="phone-notch"></div>
                <div class="phone-screen">
                    <div class="logo-container">
                        <!-- Using the logo provided by user -->
                        <img src="images/logo de cel.png" alt="Banco de Bogotá">
                        <div class="logo-text">Banco de Bogotá</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
